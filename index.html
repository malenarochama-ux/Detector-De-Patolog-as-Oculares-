<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector Visual</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #2c3e50; text-align: center; font-size: 1.5rem; margin-bottom: 20px; }
        button { background-color: #3498db; color: white; border: none; padding: 15px 40px; font-size: 1.1rem; border-radius: 30px; margin-bottom: 20px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button:active { background-color: #2980b9; }
        #webcam-container { width: 100%; display: flex; justify-content: center; }
        #webcam-container canvas { width: 100% !important; max-width: 350px !important; height: auto !important; border-radius: 15px; box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        #label-container { margin-top: 25px; width: 100%; max-width: 350px; }
        #label-container div { background: white; padding: 15px 20px; margin-bottom: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-weight: bold; border-left: 5px solid #3498db; }
    </style>
</head>
<body>

    <h1>Análisis Ocular</h1>
    <button type="button" onclick="init()">Iniciar Cámara</button>
    
    <div id="webcam-container"></div>
    <div id="label-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <script type="text/javascript">
        // =======================================================================
        // ⚠️ SOLO CAMBIA EL ENLACE DE AQUÍ ABAJO (Debe terminar con la barra / )
        // =======================================================================
        const URL = "https://teachablemachine.withgoogle.com/models/N8bFJjn4w/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true; 
            webcam = new tmImage.Webcam(200, 200, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            document.getElementById("webcam-container").innerHTML = "";
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = "";
            for (let i = 0; i < maxPredictions; i++) { 
                labelContainer.appendChild(document.createElement("div"));
            }
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const predictions = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                // Multiplicamos por 100 para que se vea como porcentaje (Ej: 95%)
                const porcentaje = Math.round(predictions[i].probability * 100);
                const texto = predictions[i].className + ": " + porcentaje + "%";
                labelContainer.childNodes[i].innerHTML = texto;
            }
        }
    </script>
</body>
</html>
